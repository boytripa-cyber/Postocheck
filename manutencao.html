<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manutenção - PostoCheck</title>

    <link
        rel="stylesheet"
        href="./manutencao.css"
    >

</head>


<body>

    <main class="maintenance-page">

        <section class="maintenance-card">

            <div class="maintenance-icon">
                ⚙
            </div>


            <div class="maintenance-brand">
                POSTO<span>CHECK</span>
            </div>


            <div class="maintenance-line"></div>


            <h1>
                SISTEMA EM MANUTENÇÃO
            </h1>


            <p
                id="mensagemManutencao"
                class="maintenance-message"
            >
                O sistema está temporariamente indisponível.
            </p>


            <div
                id="statusManutencao"
                class="maintenance-status"
            >
                Verificando sistema...
            </div>


            <div class="maintenance-loader">

                <span></span>
                <span></span>
                <span></span>

            </div>


            <p class="maintenance-info">
                Estamos trabalhando para restabelecer
                o sistema o mais breve possível.
            </p>

        </section>

    </main>


    <script
        type="module"
        src="./manutencao.js"
    ></script>

</body>

</html>
